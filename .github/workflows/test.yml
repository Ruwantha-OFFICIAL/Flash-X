name: test all service

on:
  push:
    paths:
      - "**.ts"
      - "**.js"
      - "**.json"
      - "**.html"
      - "./.github/workflows/test.yml"
    branches:
      - "main"

env:
  SMTP_USER: "flashxicn@gmail.com"
  SMTP_PASS: ${{secrets.APP_PASSWD}}

jobs:
  test_all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests 
        run: npm run test
